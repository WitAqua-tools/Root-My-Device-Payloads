name: build payloads

# main only. A merged pull request is a push to main, so that is the one event
# this needs; a run on the pull request itself would build the same commits
# twice and publish neither.
#
# A push builds what it changed and publishes nothing. Releasing is a decision,
# not something a merge does on its own: the application resolves
# releases/latest and downloads every asset from that tag, so publishing one is
# publishing to every device that asks, and it happens when someone asks for it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: one profileId, or empty for all of them
        required: false
        default: ""
      release:
        description: publish the built payloads as a release
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Pin the NDK: the exploit payload is a fixed-size blob and the app checks
  # that size, so the toolchain is part of the artifact's identity, not an
  # implementation detail of the runner. This is the sdkmanager package
  # revision for r29.
  NDK_VERSION: 29.0.14206865

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
      kernelsu_feed: ${{ steps.list.outputs.kernelsu_feed }}
      kernelsu_extra: ${{ steps.list.outputs.kernelsu_extra }}
      full: ${{ steps.list.outputs.full }}
      manager_package: ${{ steps.list.outputs.manager_package }}
      manager_size: ${{ steps.list.outputs.manager_size }}
      manager_hash: ${{ steps.list.outputs.manager_hash }}
      tag: ${{ steps.list.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history to diff the push against what main was before it.
          fetch-depth: 0

      # The patch submodule only, which is a handful of text files: it is what
      # lets a target naming a patch set that does not exist fail in this job
      # rather than inside the kernel build that would have applied it. The
      # KernelSU checkout is not needed to validate anything.
      - name: Check out the patch submodule
        run: git submodule update --init --depth 1 src/kernelsu/Root-My-Device-KSU

      # Fail here, in seconds, rather than after a matrix of kernel builds.
      # Everything checked at this point is hand-authored, so a mistake in it
      # cannot be caught by any later step that only inspects binaries.
      - name: Validate src/targets.json
        run: python3 tools/generate_feed.py --emit validate

      - id: list
        # The build matrices come out of the same script that generates the
        # feed, so nothing here has to re-derive how a target maps onto a path.
        # Adding a target or a payload needs no workflow change.
        #
        # A push builds only what it changed. The script decides what that
        # reaches -- a target's own directory, or the core its payload shares
        # with the targets on that core -- and answers "everything" for any
        # path it cannot confine, which is most of them.
        #
        # `full` is the part that matters downstream: a feed can only be
        # generated from a run that built every target, because it joins each
        # entry to the artifact's exact size.
        #
        # The KernelSU builds are split by whether anything that can reach the
        # feed depends on them. Only that half can hold up a release: a build
        # no publishable target needs is published when it succeeds and
        # reported when it does not, but it must never be the reason the app is
        # left with no payloads to fetch.
        env:
          ONLY: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          narrow=()
          if [ '${{ github.event_name }}' = push ]; then
            # A first push to a branch, or a force-push, gives a null before;
            # there is nothing to diff against, so build everything.
            if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git diff --name-only "$BEFORE" '${{ github.sha }}' > changed.txt
              echo "changed since $BEFORE:"; sed 's/^/  /' changed.txt
              narrow=(--changed-file changed.txt)
            else
              echo "no usable before-sha; building everything"
            fi
          fi

          if [ -n "$ONLY" ]; then
            if [ '${{ inputs.release }}' = true ]; then
              echo "::error::a release has to be every target -- the feed joins each entry"
              echo "::error::to its artifact's size, so one built alone cannot produce one"
              exit 1
            fi
            narrow=(--only "$ONLY")
          fi

          plan=$(python3 tools/generate_feed.py --emit plan "${narrow[@]}")

          {
            echo "full=$(jq -r .full <<<"$plan")"
            echo "targets=$(jq -c .targets <<<"$plan")"
            echo "kernelsu_feed=$(jq -c .kernelsuFeed <<<"$plan")"
            echo "kernelsu_extra=$(jq -c .kernelsuExtra <<<"$plan")"
            # One manager for every build, so it comes out of the plan once
            # rather than out of each matrix entry.
            echo "manager_package=$(jq -r .managerPackage <<<"$plan")"
            echo "manager_size=$(jq -r .managerSignatureSize <<<"$plan")"
            echo "manager_hash=$(jq -r .managerSignatureHash <<<"$plan")"
            # A tag that is unique per run. The app resolves releases/latest and
            # then downloads every artifact from that tag, so the set it sees
            # has to be immutable once published -- a rolling tag whose assets
            # get replaced would break that.
            echo "tag=payloads-${{ github.run_number }}-$(echo '${{ github.sha }}' | cut -c-7)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  exploit:
    needs: discover
    if: needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      # Installed through the runner's own SDK rather than a third-party action.
      # setup-ndk with local-cache restored a tree whose bin/clang symlink was
      # missing, and the NDK's aarch64-linux-android35-clang is a shell wrapper
      # that execs "$bin_dir/clang" -- so the build died with
      # "clang: No such file or directory" from inside the compiler driver.
      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Fail here, with the reason, rather than inside a compile of the payload.
      - name: Check the toolchain is complete
        run: |
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for f in clang aarch64-linux-android35-clang; do
            if [ ! -e "$bin/$f" ]; then
              echo "::error::$bin/$f is missing or a dangling symlink"
              ls -la "$bin/$f" || true
              exit 1
            fi
          done
          "$bin/aarch64-linux-android35-clang" --version

      - name: Build ${{ matrix.target.profileId }}
        env:
          TARGET: ${{ matrix.target.target }}
          PAYLOAD: ${{ matrix.target.payload }}
          # Which exploit core this target's kernel needs. It comes from
          # src/targets.json like everything else about a target, so adding a
          # target on a new GKI branch needs no workflow change.
          CORE: ${{ matrix.target.core }}
        run: |
          make TARGET="$TARGET" PAYLOAD="$PAYLOAD" CORE="$CORE"
          make TARGET="$TARGET" PAYLOAD="$PAYLOAD" CORE="$CORE" release
          echo "OUTDIR=build/${TARGET//\//_}" >> "$GITHUB_ENV"
          echo "SLUG=$(echo "$PAYLOAD" | tr 'A-Z' 'a-z')" >> "$GITHUB_ENV"

      # The Makefile already fails the build if the release payload exceeds the
      # fixed size, then pads to it. Re-assert the final size here so a change
      # to that rule cannot pass unnoticed: the app downloads a fixed-length
      # blob and a mismatch is a runtime failure on the device, not a build one.
      - name: Check release payload size
        run: |
          expected=$(grep -oP '^APP_RELEASE_SIZE\s*:=\s*\K[0-9]+' Makefile)
          actual=$(stat -c %s "$OUTDIR/$SLUG-app.release.so")
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"

      # Flat names, because release assets share one namespace.
      - name: Collect
        run: |
          mkdir -p out
          cp "$OUTDIR/$SLUG-app.release.so" "out/${{ matrix.target.asset }}"
          cp "$OUTDIR/$SLUG-root" "out/$SLUG-root"

      - uses: actions/upload-artifact@v4
        with:
          name: exploit-${{ matrix.target.profileId }}
          path: out/
          if-no-files-found: error

  kernelsu:
    # The builds something publishable depends on. A failure here means the
    # feed cannot be built, so it does stop a release.
    needs: discover
    if: needs.discover.outputs.kernelsu_feed != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.discover.outputs.kernelsu_feed) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The module's KSU_VERSION is 30000 + the KernelSU submodule's commit
          # count, and so is the name of the patch directory the action picks.
          # A depth-1 checkout counts 1: it would look for patches/30001 and
          # build a module claiming version 30001, which is below the manager's
          # MINIMAL_SUPPORTED_KERNEL of 32513. Full history, in both jobs.
          fetch-depth: 0
      - uses: ./.github/actions/build-kernelsu
        with:
          id: ${{ matrix.build.id }}
          kmi: ${{ matrix.build.kmi }}
          ddk-image: ${{ matrix.build.ddkImage }}
          kernel-release: ${{ matrix.build.kernelRelease }}
          config: ${{ join(matrix.build.config, ' ') }}
          patch-sets: ${{ join(matrix.build.patchSets, ' ') }}
          prebuilt-module-url: ${{ matrix.build.prebuiltModule.url }}
          prebuilt-module-sha256: ${{ matrix.build.prebuiltModule.sha256 }}
          manager-package: ${{ needs.discover.outputs.manager_package }}
          manager-signature-size: ${{ needs.discover.outputs.manager_size }}
          manager-signature-hash: ${{ needs.discover.outputs.manager_hash }}
          ndk-version: ${{ env.NDK_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: kernelsu-${{ matrix.build.id }}
          path: out/
          if-no-files-found: error

  kernelsu-extra:
    # Builds no publishable target depends on. Nothing downstream waits on the
    # result, so a target whose kernel source is not reproducible from a
    # generic DDK cannot leave the app with no payloads to fetch.
    needs: discover
    if: needs.discover.outputs.kernelsu_extra != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.discover.outputs.kernelsu_extra) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The module's KSU_VERSION is 30000 + the KernelSU submodule's commit
          # count, and so is the name of the patch directory the action picks.
          # A depth-1 checkout counts 1: it would look for patches/30001 and
          # build a module claiming version 30001, which is below the manager's
          # MINIMAL_SUPPORTED_KERNEL of 32513. Full history, in both jobs.
          fetch-depth: 0
      - uses: ./.github/actions/build-kernelsu
        with:
          id: ${{ matrix.build.id }}
          kmi: ${{ matrix.build.kmi }}
          ddk-image: ${{ matrix.build.ddkImage }}
          kernel-release: ${{ matrix.build.kernelRelease }}
          config: ${{ join(matrix.build.config, ' ') }}
          patch-sets: ${{ join(matrix.build.patchSets, ' ') }}
          prebuilt-module-url: ${{ matrix.build.prebuiltModule.url }}
          prebuilt-module-sha256: ${{ matrix.build.prebuiltModule.sha256 }}
          manager-package: ${{ needs.discover.outputs.manager_package }}
          manager-signature-size: ${{ needs.discover.outputs.manager_size }}
          manager-signature-hash: ${{ needs.discover.outputs.manager_hash }}
          ndk-version: ${{ env.NDK_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: kernelsu-${{ matrix.build.id }}
          path: out/
          if-no-files-found: error

  feed:
    # The app resolves releases/latest and then fetches targets-v2.json plus
    # every artifact named in it, so a malformed feed or a target whose
    # artifact is missing breaks installs at run time. Build it from what the
    # matrices actually produced rather than from anything committed.
    #
    # Only from a run that built every target: each entry is joined to its
    # artifact's exact size, so a narrowed run has nothing to join half of them
    # to. A push that changed one core builds and checks that core and stops
    # there.
    #
    # always(): the kernelsu matrix is skipped outright when no target is ready
    # for the feed, and a feed with no entries is still a valid thing to
    # publish while a port is in progress.
    needs: [discover, exploit, kernelsu]
    if: |
      always()
      && needs.discover.outputs.full == 'true'
      && needs.exploit.result == 'success'
      && needs.kernelsu.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The feed names the KernelSU manager each module pairs with, and
          # that comes from the pin the module was built from -- so this job
          # needs the submodule, with the history the count is taken from,
          # exactly as the build jobs do.
          submodules: true
          fetch-depth: 0

      # The one check the two repositories cannot do for each other. The
      # modules were built to accept exactly this package and this certificate;
      # the APK they have to match is built and signed somewhere else, and
      # neither side can compare strings across the gap. Both can look at the
      # artifact, so this looks at the artifact. A mismatch here is a device
      # that installs a manager the kernel never finds and says nothing about.
      - name: Check the manager the feed sends people to
        run: |
          set -euo pipefail
          url=$(jq -r .url src/kernelsu/manager.json)
          want_pkg='${{ needs.discover.outputs.manager_package }}'
          want_hash='${{ needs.discover.outputs.manager_hash }}'
          echo "$url"
          curl -fsSL "$url" -o manager.apk

          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          badging=$("$tools/aapt2" dump badging manager.apk)
          got_pkg=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging")
          got_hash=$("$tools/apksigner" verify --print-certs manager.apk \
                     | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "package: $got_pkg"
          echo "cert:    $got_hash"
          [ "$got_pkg" = "$want_pkg" ] || {
            echo "::error::the manager is $got_pkg, but the modules only accept $want_pkg"; exit 1; }
          [ "$got_hash" = "$want_hash" ] || {
            echo "::error::the manager is signed with $got_hash, but the modules look for $want_hash"; exit 1; }
          rm -f manager.apk

      - uses: actions/download-artifact@v4
        with:
          pattern: exploit-*
          path: artifacts/exploit
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: kernelsu-*
          path: artifacts/kernelsu
          merge-multiple: true

      - name: Generate the support feed
        run: |
          mkdir -p artifacts/kernelsu
          python3 tools/generate_feed.py --emit feed \
            --exploit-dir artifacts/exploit \
            --ksud-dir artifacts/kernelsu \
            --repository "$GITHUB_REPOSITORY" \
            --tag '${{ needs.discover.outputs.tag }}' \
            --output support/targets-v2.json
          cat support/targets-v2.json

      # The generator writes these URLs, so this is a check that it and the app
      # still agree on where a release asset lives. PayloadRepository.kt
      # require()s the same prefix and fails every install if they diverge.
      - name: Check the feed URLs point at this release
        run: |
          expected="https://github.com/$GITHUB_REPOSITORY/releases/download/${{ needs.discover.outputs.tag }}/"
          echo "expected prefix: $expected"
          python3 - "$expected" <<'PY'
          import json, sys
          expected = sys.argv[1]
          bad = 0
          for target in json.load(open('support/targets-v2.json'))['targets']:
              for field in ('exploit', 'kernelsu'):
                  url = target[field]['url']
                  if not url.startswith(expected):
                      print(f"{target['profileId']}.{field}: {url}")
                      bad += 1
          print(f"{bad} URL(s) not anchored to this release")
          sys.exit(1 if bad else 0)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: feed
          path: support/targets-v2.json
          if-no-files-found: error

  publish:
    # Only ever from a hand-started run with the box ticked. A merge builds and
    # checks; what reaches devices is decided by a person, because the app
    # resolves releases/latest and takes every asset from whatever tag is
    # sitting there.
    #
    # kernelsu-extra is waited on so its artifacts make it into the release,
    # but always() means a failure there does not withhold one. The feed is the
    # only hard requirement.
    needs: [discover, feed, kernelsu-extra]
    if: |
      always()
      && needs.feed.result == 'success'
      && github.event_name == 'workflow_dispatch'
      && inputs.release
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List assets
        run: |
          ls -la assets
          if [ '${{ needs.kernelsu-extra.result }}' = 'failure' ]; then
            echo "::warning::kernelsu-extra failed; the release carries only the builds that completed"
          fi

      - name: Publish ${{ needs.discover.outputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.discover.outputs.tag }}
          # The app reads releases/latest, which skips drafts and prereleases.
          draft: false
          prerelease: false
          make_latest: true
          body: |
            Payloads built from ${{ github.sha }}.

            `targets-v2.json` is the support feed the application reads; every
            other asset is referenced from it by this tag.
          files: assets/*
          fail_on_unmatched_files: true
