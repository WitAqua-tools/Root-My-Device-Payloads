name: Build a KernelSU late-load artifact
description: >
  Build one target's kernelsu.json entry from the pinned submodule: the kernel
  module in its KMI's DDK image, then the ksud that embeds it. Leaves both in
  out/ as ksud-<id> and kernelsu-<id>.ko.

inputs:
  id:
    description: builds.json entry id
    required: true
  kmi:
    description: KMI the module is built for
    required: true
  ddk-image:
    description: DDK container image for that KMI
    required: true
  kernel-release:
    description: exact UTS release the module must claim
    required: true
  config:
    description: space-separated kernel config options for this build, may be empty
    required: false
    default: ""
  patch-sets:
    description: >
      space-separated patch sets this build takes on top of common, named as
      directories under the patch submodule's patches/<version>/, where the
      version comes from the KernelSU pin and not from here; may be empty
    required: false
    default: ""
  manager-signature-size:
    description: >
      DER size of a second certificate the module should accept as a manager,
      as 0x0524. Upstream's stays in the first slot, so a module built with
      this still recognises the official manager. Empty for a target that uses
      only the official one.
    required: false
    default: ""
  manager-signature-hash:
    description: sha256 of that certificate, lowercase hex
    required: false
    default: ""
  ndk-version:
    description: sdkmanager package revision of the NDK to build ksud with
    required: true

runs:
  using: composite
  steps:
    # The patches are the source of truth for the delta; the KernelSU submodule
    # stays an unmodified upstream checkout pinned to the tag they were written
    # against, so a failure to apply is a real signal rather than noise.
    #
    # They live in their own repository because they are a derivative work of
    # KernelSU and carry its GPL terms rather than this repository's Apache-2.0
    # ones -- device-specific ones included, which is why none of them live
    # beside the target here.
    #
    # patches/<version>/common is what no target can boot without and goes on
    # every build. Everything else is a set the build named in its
    # kernelsu.json, so a vendor's workarounds are not even present in the tree
    # of a build that is not that vendor's.
    #
    # <version> is derived from the pin rather than named anywhere, so the sets
    # that apply and the tree they apply to cannot come apart: moving the pin
    # selects a different directory, and a pin with no directory fails here
    # instead of building against hunks written for another revision.
    - name: Apply the KernelSU patches
      shell: bash
      env:
        PATCH_SETS: ${{ inputs.patch-sets }}
      run: |
        shopt -s nullglob

        for submodule in src/kernelsu/KernelSU src/kernelsu/Root-My-Device-KSU; do
          if [ ! -e "$submodule/.git" ]; then
            echo "::error::$submodule is missing; check out the submodules"
            exit 1
          fi
        done

        # The same expression kernel/Kbuild compiles into KSU_VERSION, so the
        # directory is named after the version the module will report. A
        # shallow checkout counts 1 and would both look for patches/30001 and
        # build a module claiming version 30001 -- under the manager's
        # MINIMAL_SUPPORTED_KERNEL of 32513, and so rejected on the device
        # rather than here. Say that, instead of leaving it to the device.
        if [ "$(git -C src/kernelsu/KernelSU rev-parse --is-shallow-repository)" != false ]; then
          echo "::error::the KernelSU submodule is a shallow checkout, so it has no"
          echo "::error::commit count to take a version from; check out with fetch-depth: 0"
          exit 1
        fi
        version=$((30000 + $(git -C src/kernelsu/KernelSU rev-list --count HEAD)))
        echo "KernelSU version: $version"
        root=src/kernelsu/Root-My-Device-KSU/patches/$version
        echo "KSU_EXPECTED_VERSION=$version" >> "$GITHUB_ENV"

        if [ ! -d "$root" ]; then
          echo "::error::no patches for KernelSU $version at $root;"
          echo "::error::either the submodules are not checked out, or the pin moved"
          echo "::error::to a revision nothing has been rebased onto yet"
          exit 1
        fi

        apply_set() {
          local set=$1 patches=("$root/$1"/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "::error::patch set '$set' has no patches at $root/$set"
            exit 1
          fi
          for patch in "${patches[@]}"; do
            echo "applying $patch"
            git -C src/kernelsu/KernelSU apply --check "$GITHUB_WORKSPACE/$patch"
            git -C src/kernelsu/KernelSU apply "$GITHUB_WORKSPACE/$patch"
          done
        }

        # common first and unconditionally: the staged late-load is required,
        # and the sets are written against a tree that already has it.
        apply_set common
        for set in $PATCH_SETS; do
          apply_set "$set"
        done

    - name: Install NDK ${{ inputs.ndk-version }}
      shell: bash
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          "ndk;${{ inputs.ndk-version }}" > /dev/null

    - name: Build the ${{ inputs.id }} kernel module
      shell: bash
      run: |
        set -o pipefail
        docker run --rm \
          -v "$PWD:/workspace" \
          -w /workspace/src/kernelsu/KernelSU/kernel \
          -e KERNEL_RELEASE='${{ inputs.kernel-release }}' \
          -e TARGET_CONFIG='${{ inputs.config }}' \
          -e KSU_EXPECTED_SIZE2='${{ inputs.manager-signature-size }}' \
          -e KSU_EXPECTED_HASH2='${{ inputs.manager-signature-hash }}' \
          '${{ inputs.ddk-image }}' \
          bash -eu -c '
            # Without this the module records no KSU_GIT_VERSION, because the
            # bind-mounted tree is owned by a different uid than the container.
            git config --global --add safe.directory /workspace/src/kernelsu/KernelSU

            # The DDK ships its own release string and the targets set
            # CONFIG_MODULE_FORCE_LOAD=n, so the module has to be built
            # claiming the exact release of the kernel it will be loaded into.
            # For a build whose kernelRelease is already the image default this
            # is a no-op, which is how the S25U module was originally produced.
            old=$(cat "$KDIR/include/config/kernel.release")
            echo "kernel release: $old -> $KERNEL_RELEASE"
            sed -i "s|$old|$KERNEL_RELEASE|g" "$KDIR/include/generated/utsrelease.h"
            printf "%s\n" "$KERNEL_RELEASE" > "$KDIR/include/config/kernel.release"

            # ksud late-load resolves undefined symbols from /proc/kallsyms
            # before init_module, which requires a zero-length __versions
            # section. Leaving the DDK Module.symvers in place would make
            # modpost emit CRCs for a kernel that is not the target.
            : > "$KDIR/Module.symvers"

            make clean >/dev/null 2>&1 || true

            # Kbuild takes the second manager certificate as a make variable
            # and errors out if only one half of the pair is set, so an empty
            # one has to be absent rather than empty. Environment variables are
            # make variables, so exporting is all it takes.
            if [ -n "${KSU_EXPECTED_SIZE2:-}" ]; then
              echo "manager signature slot 2: $KSU_EXPECTED_SIZE2 $KSU_EXPECTED_HASH2"
            else
              unset KSU_EXPECTED_SIZE2 KSU_EXPECTED_HASH2
            fi

            # env, not a bare prefix: the shell only recognises assignments
            # written literally before expansion, so $TARGET_CONFIG would be
            # run as a command instead of setting the options.
            env CONFIG_KSU=m $TARGET_CONFIG KBUILD_MODPOST_WARN=1 CC=clang make -j"$(nproc)"
          ' | tee kernelsu-build.log
        sudo chown -R "$(id -u):$(id -g)" src/kernelsu/KernelSU

        # Kbuild prints what it compiled in, and that number is only right if
        # git resolved inside the container. It reaches the device as the
        # version the manager accepts or refuses, so close the loop here rather
        # than reading it out of a log after a run.
        # Same for the second manager certificate: a module that silently went
        # out without it does not recognise the manager the target names, and
        # says nothing on the device about why.
        if [ -n '${{ inputs.manager-signature-size }}' ]; then
          slot=$(sed -n 's/^-- KernelSU Manager signature hash2: //p' kernelsu-build.log | tail -1)
          if [ "$slot" != '${{ inputs.manager-signature-hash }}' ]; then
            echo "::error::the module was built trusting $slot in slot 2, not ${{ inputs.manager-signature-hash }}"
            exit 1
          fi
          echo "manager signature slot 2: $slot"
        fi

        built=$(sed -n 's/^-- KernelSU version: //p' kernelsu-build.log | tail -1)
        echo "built=$built expected=$KSU_EXPECTED_VERSION"
        if [ "$built" != "$KSU_EXPECTED_VERSION" ]; then
          echo "::error::the module was built as KernelSU $built, not $KSU_EXPECTED_VERSION"
          exit 1
        fi
        rm -f kernelsu-build.log

    # Both of these are load-time contracts with the target kernel, and both
    # fail on the device rather than in the build if they are wrong.
    - name: Check the module's load-time identity
      shell: bash
      run: |
        ko=src/kernelsu/KernelSU/kernel/kernelsu.ko
        actual=$(strings -a "$ko" | grep -m1 '^vermagic=')
        expected='vermagic=${{ inputs.kernel-release }} SMP preempt mod_unload modversions aarch64'
        echo "actual:   $actual"
        echo "expected: $expected"
        test "$actual" = "$expected"
        versions=$(readelf -SW "$ko" | sed 's/^ *\[[ 0-9]*\] *//' | awk '$1 == "__versions" { print $5 }')
        echo "__versions size: 0x${versions:-missing}"
        test -n "$versions"
        test "$((16#$versions))" -eq 0

    - name: Build ksud for ${{ inputs.id }}
      shell: bash
      run: |
        ndk="$ANDROID_HOME/ndk/${{ inputs.ndk-version }}/toolchains/llvm/prebuilt/linux-x86_64"
        "$ndk/bin/llvm-strip" -d src/kernelsu/KernelSU/kernel/kernelsu.ko
        # ksud embeds every bin/aarch64/<kmi>_kernelsu.ko at compile time and
        # picks one by KMI at run time, so the module has to be in place before
        # the Rust build, and the pair must be published together.
        cp src/kernelsu/KernelSU/kernel/kernelsu.ko \
          "src/kernelsu/KernelSU/userspace/ksud/bin/aarch64/${{ inputs.kmi }}_kernelsu.ko"
        rustup target add aarch64-linux-android
        export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ndk/bin/aarch64-linux-android35-clang"
        export CC_aarch64_linux_android="$ndk/bin/aarch64-linux-android35-clang"
        export AR_aarch64_linux_android="$ndk/bin/llvm-ar"
        export LIBCLANG_PATH="$ndk/lib"
        # ksud's build script runs bindgen over src/ksu_uapi.h. Without an
        # explicit target and sysroot, libclang resolves the runner's own
        # /usr/include and dies on a missing asm/ioctl.h.
        export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android35 --sysroot=$ndk/sysroot"
        cargo build --release --target aarch64-linux-android -p ksud \
          --manifest-path src/kernelsu/KernelSU/Cargo.toml

    - name: Collect
      shell: bash
      run: |
        mkdir -p out
        cp src/kernelsu/KernelSU/target/aarch64-linux-android/release/ksud \
          out/ksud-${{ inputs.id }}
        # Published for auditing; the copy that actually loads is the one
        # embedded in ksud above.
        cp src/kernelsu/KernelSU/kernel/kernelsu.ko out/kernelsu-${{ inputs.id }}.ko
